<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
  :root {
    --fg: var(--vscode-foreground); --muted: var(--vscode-descriptionForeground); --line: var(--vscode-panel-border, #8884);
    --bg: var(--vscode-editor-background); --raise: var(--vscode-sideBar-background, var(--bg)); --input: var(--vscode-input-background); --input-fg: var(--vscode-input-foreground);
    --hover: var(--vscode-toolbar-hoverBackground, #8882); --sel: var(--vscode-list-activeSelectionBackground, #0078d455); --sel-fg: var(--vscode-list-activeSelectionForeground, var(--fg));
    --accent: var(--vscode-button-background); --accent-fg: var(--vscode-button-foreground); --focus: var(--vscode-focusBorder); --mono: var(--vscode-editor-font-family, monospace);
    --ok: var(--vscode-charts-green, #4ec27a); --warn: var(--vscode-editorWarning-foreground, #e2b34a); --err: var(--vscode-errorForeground, #f2676b);
    --blue: var(--vscode-charts-blue, #3794ff); --orange: var(--vscode-charts-orange, #d18616); --purple: var(--vscode-charts-purple, #b180d7); --yellow: var(--vscode-charts-yellow, #e2c08d);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 18px 24px; color: var(--fg); background: var(--bg); font-family: var(--vscode-font-family); font-size: 13px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .ws { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  .count { font-size: 11px; padding: 0 7px; border-radius: 9px; background: var(--hover); color: var(--muted); font-weight: 400; }
  .count.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .btn { border: 1px solid transparent; border-radius: 4px; padding: 3px 12px; background: var(--hover); white-space: nowrap; }
  .btn:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .btn.pri { background: var(--accent); color: var(--accent-fg); }
  .btn.pri:hover { background: var(--vscode-button-hoverBackground, var(--accent)); }
  .btn.sm { padding: 0 10px; font-size: 12px; }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .toolbar input[type=search] { flex: 1; min-width: 140px; max-width: 320px; background: var(--input); color: var(--input-fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
  .toolbar input[type=date] { background: var(--input); color: var(--input-fg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; color-scheme: dark light; }
  .summary { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .list { border: 1px solid var(--line); border-radius: 6px; background: var(--raise); padding: 4px; min-height: 120px; outline: none; }
  .list.drop-root { box-shadow: inset 0 0 0 2px var(--accent); }
  .row { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 3px; min-height: 24px; cursor: default; user-select: none; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); color: var(--sel-fg); }
  .row.drop { box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .row.dragging { opacity: .45; }
  .chev { width: 14px; color: var(--muted); flex: none; text-align: center; transition: transform .1s; }
  .chev.open { transform: rotate(90deg); }
  .ico { width: 16px; height: 16px; flex: none; }
  .ico.folder { color: var(--yellow); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name.folder { font-weight: 600; }
  .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
  .method { min-width: 50px; text-align: center; font: 600 10px var(--mono); padding: 1px 4px; border-radius: 3px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); flex: none; }
  .GET { --c: var(--blue); } .POST { --c: var(--ok); } .PUT { --c: var(--orange); } .PATCH { --c: var(--purple); } .DELETE { --c: var(--err); } .other { --c: var(--muted); }
  .acts { display: none; gap: 2px; }
  .row:hover .acts, .row.sel .acts { display: flex; }
  .ibtn { background: none; border: 0; border-radius: 3px; padding: 0 6px; color: var(--muted); font-size: 12px; }
  .ibtn:hover { background: var(--hover); color: var(--fg); }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
  .dot.on { background: var(--ok); border-color: var(--ok); }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .menu { position: fixed; z-index: 10; min-width: 190px; padding: 4px; background: var(--vscode-menu-background, var(--bg)); color: var(--vscode-menu-foreground, var(--fg)); border: 1px solid var(--vscode-menu-border, var(--line)); border-radius: 5px; box-shadow: 0 4px 14px #0006; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 3px 12px; border-radius: 3px; }
  .menu button:hover, .menu button:focus { background: var(--vscode-menu-selectionBackground, var(--sel)); outline: none; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .danger { color: var(--err); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="head"><h1>http.me Dashboard</h1><span class="ws" id="ws"></span><span class="spacer"></span><button type="button" class="btn ghost" id="refresh">Refresh</button></div>
<div class="tabs" role="tablist" aria-label="Dashboard">
  <button type="button" class="tab" role="tab" id="tab-collections" data-tab="collections">Collections <span class="count" id="c-collections"></span></button>
  <button type="button" class="tab" role="tab" id="tab-environments" data-tab="environments">Environments <span class="count" id="c-environments"></span></button>
  <button type="button" class="tab" role="tab" id="tab-cookies" data-tab="cookies">Cookies <span class="count" id="c-cookies"></span></button>
  <button type="button" class="tab" role="tab" id="tab-history" data-tab="history">History <span class="count" id="c-history"></span></button>
  <button type="button" class="tab" role="tab" id="tab-backups" data-tab="backups">Backups <span class="count" id="c-backups"></span></button>
</div>
<main id="panel" role="tabpanel"></main>
<script nonce="{{nonce}}" src="dashboard.js"></script>
</body>
</html>
