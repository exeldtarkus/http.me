<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
  :root {
    --fg: var(--vscode-foreground); --muted: var(--vscode-descriptionForeground); --line: var(--vscode-panel-border, #8884);
    --bg: var(--vscode-editor-background); --raise: var(--vscode-sideBar-background, var(--bg)); --input: var(--vscode-input-background); --input-fg: var(--vscode-input-foreground);
    --hover: var(--vscode-toolbar-hoverBackground, #8882); --accent: var(--vscode-button-background); --accent-fg: var(--vscode-button-foreground);
    --focus: var(--vscode-focusBorder); --mono: var(--vscode-editor-font-family, monospace);
    --ok: var(--vscode-charts-green, #4ec27a); --warn: var(--vscode-editorWarning-foreground, #e2b34a); --err: var(--vscode-errorForeground, #f2676b);
    --blue: var(--vscode-charts-blue, #3794ff); --orange: var(--vscode-charts-orange, #d18616); --purple: var(--vscode-charts-purple, #b180d7);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 18px 76px; color: var(--fg); background: var(--bg); font-family: var(--vscode-font-family); font-size: 13px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
  input[type=text], input[type=search], select { background: var(--input); color: var(--input-fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 4px; }
  .title { font-size: 18px; font-weight: 600; margin: 0; }
  .badge { font-size: 11px; border-radius: 10px; padding: 1px 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip { font-size: 12px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); color: var(--muted); }
  .chip b { color: var(--fg); font-weight: 600; }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .chip.exists { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
  .card { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); }
  .card label { color: var(--muted); font-size: 12px; }
  .card input[type=text] { flex: 1; min-width: 180px; font-family: var(--mono); font-size: 12px; }
  .btn { border: 1px solid transparent; border-radius: 4px; padding: 3px 12px; background: var(--hover); }
  .btn:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .btn.pri { background: var(--accent); color: var(--accent-fg); }
  .btn.pri:hover { background: var(--vscode-button-hoverBackground, var(--accent)); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; }
  .toolbar .conf { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
  .toolbar .conf[hidden] { display: none; }
  #tree { margin: 0; padding: 4px 6px; list-style: none; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); }
  #tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px solid color-mix(in srgb, var(--line) 70%, transparent); margin-left: 8px; }
  details > summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: '\203A'; width: 10px; color: var(--muted); transition: transform .12s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary:hover, .item:hover { background: var(--hover); }
  .folder { font-weight: 600; }
  .n { color: var(--muted); font-size: 12px; font-weight: 400; }
  .item { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 3px; flex-wrap: wrap; }
  .item .name { font-family: var(--mono); font-size: 12px; }
  .item .name.dim { color: var(--muted); }
  .method { min-width: 52px; text-align: center; font: 600 10px var(--mono); padding: 1px 4px; border-radius: 3px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .GET { --c: var(--blue); } .POST { --c: var(--ok); } .PUT { --c: var(--orange); } .PATCH { --c: var(--purple); } .DELETE { --c: var(--err); }
  .method.other { --c: var(--muted); }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .tag.exists { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .item select { font-size: 12px; padding: 0 4px; }
  .warns { flex-basis: 100%; margin: 0 0 2px 84px; color: var(--warn); font-size: 12px; }
  .empty { padding: 16px; color: var(--muted); text-align: center; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--bg); border-top: 1px solid var(--line); }
  footer .count { margin-right: auto; color: var(--muted); font-size: 12px; }
  footer .note { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: minmax(260px, 2fr) 3fr; gap: 12px; align-items: start; }
  .col { min-width: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .opts { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); }
  .opts label { display: flex; align-items: center; gap: 6px; }
  .opts label[hidden] { display: none; }
  #warnings { margin: 0 0 10px; padding: 6px 10px 6px 26px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 6px; color: var(--warn); font-size: 12px; max-height: 140px; overflow: auto; }
  #warnings:empty { display: none; }
  #preview { margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); font: 12px/1.45 var(--mono); max-height: 60vh; overflow: auto; white-space: pre; tab-size: 2; }
  #preview.busy { opacity: .5; }
  #previewError { color: var(--err); margin: 0 0 6px; font-size: 12px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .warns { margin-left: 24px; } footer .note { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="head"><h1 class="title">Export</h1><span class="badge" id="badge"></span></div>
<p class="sub" id="sub"></p>
<div class="chips" id="chips"></div>
<div class="card"><label for="format">Format</label>
  <select id="format" aria-label="Export format"><option value="postman">Postman Collection v2.1</option><option value="3.0.3">OpenAPI 3.0.3</option><option value="3.1.0">OpenAPI 3.1.0</option></select>
  <label for="out">Save as</label><input type="text" id="out" aria-label="Save as"><button type="button" class="btn ghost" id="browse">Browse…</button></div>
<div class="layout">
  <div class="col">
    <h2>Options</h2>
    <div class="opts">
      <label id="yamlBox" hidden><input type="checkbox" id="yaml"> YAML instead of JSON</label>
      <label id="optScriptsBox"><input type="checkbox" id="optScripts" checked> Translate scripts (httpme.* to pm.*)</label>
      <label id="optEnvBox"><input type="checkbox" id="optEnv"> Include Environments (and Globals)</label>
      <label id="optJetbrainsBox" hidden><input type="checkbox" id="optJetbrains"> As http-client.env.json (JetBrains) instead of Postman files</label>
      <label id="optSecretsBox" hidden><input type="checkbox" id="optSecrets"> Include secret values (asks for confirmation)</label>
    </div>
    <h2>Requests</h2>
    <div class="toolbar">
      <input type="search" id="filter" placeholder="Filter by name or method" aria-label="Filter">
      <button type="button" class="btn ghost" id="all">All</button><button type="button" class="btn ghost" id="none">None</button>
    </div>
    <ul id="tree"></ul>
  </div>
  <div class="col">
    <h2>Warnings</h2>
    <ul id="warnings"></ul>
    <h2>Preview <span class="n" id="previewInfo"></span></h2>
    <p id="previewError" hidden></p>
    <pre id="preview" tabindex="0" aria-label="Preview of the exported file"></pre>
  </div>
</div>
<footer><span class="count" id="count"></span><span class="note">Nothing is written until you click Export.</span><button type="button" class="btn ghost" id="cancel">Cancel</button><button type="button" class="btn pri" id="go">Export</button></footer>
<script nonce="{{nonce}}" src="exportDialog.js"></script>
</body>
</html>
