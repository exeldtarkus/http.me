<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
  :root {
    --fg: var(--vscode-foreground); --muted: var(--vscode-descriptionForeground); --line: var(--vscode-panel-border, #8884);
    --bg: var(--vscode-editor-background); --input: var(--vscode-input-background); --input-fg: var(--vscode-input-foreground);
    --hover: var(--vscode-toolbar-hoverBackground, #8882); --accent: var(--vscode-button-background); --accent-fg: var(--vscode-button-foreground);
    --focus: var(--vscode-focusBorder); --mono: var(--vscode-editor-font-family, monospace);
    --ok: var(--vscode-charts-green, #4ec27a); --warn: var(--vscode-editorWarning-foreground, #e2b34a); --err: var(--vscode-errorForeground, #f2676b);
    --code-key: var(--vscode-debugTokenExpression-name, #9cdcfe); --code-str: var(--vscode-debugTokenExpression-string, #ce9178);
    --code-num: var(--vscode-debugTokenExpression-number, #b5cea8);
    --m-get: var(--vscode-charts-green); --m-post: var(--vscode-charts-yellow); --m-put: var(--vscode-charts-blue); --m-patch: var(--vscode-charts-purple);
    --m-delete: var(--vscode-charts-red); --m-head: var(--vscode-terminal-ansiCyan); --m-options: var(--vscode-terminal-ansiMagenta); --m-query: var(--vscode-terminal-ansiBrightCyan);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--fg); background: var(--bg); font-family: var(--vscode-font-family); font-size: 13px; line-height: 1.45;
    display: grid; grid-template-rows: auto auto auto minmax(80px, 1fr) 1px minmax(120px, 1.4fr); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
  input, select, textarea { background: var(--input); color: var(--input-fg); border: 1px solid var(--line); border-radius: 3px; }
  .urlrow { display: flex; gap: 8px; padding: 12px 14px 6px; }
  .urlbox { flex: 1; display: flex; min-width: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--input); }
  .urlbox select { border: 0; border-right: 1px solid var(--line); background: transparent; font: 600 12px var(--mono); padding: 0 6px; border-radius: 4px 0 0 4px; }
  .urlbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 10px; font: 12.5px var(--mono); }
  .m-GET { color: var(--m-get); } .m-POST { color: var(--m-post); } .m-PUT { color: var(--m-put); } .m-PATCH { color: var(--m-patch); }
  .m-DELETE { color: var(--m-delete); } .m-HEAD { color: var(--m-head); } .m-OPTIONS { color: var(--m-options); } .m-QUERY { color: var(--m-query); }
  .btn { border: 1px solid transparent; border-radius: 4px; padding: 5px 14px; background: var(--hover); }
  .btn.pri { background: var(--accent); color: var(--accent-fg); font-weight: 600; min-width: 84px; }
  .btn.pri.busy { background: var(--err); color: var(--vscode-editor-background); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.sm { padding: 2px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { margin: 0; padding: 0 14px 6px; color: var(--muted); font-size: 12px; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .subtabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; color: var(--muted); white-space: nowrap; }
  .subtabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
  .subtabs button:disabled { opacity: .45; cursor: not-allowed; }
  .subtabs .n { font-size: 11px; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .pane { overflow: auto; padding: 8px 14px 12px; min-height: 0; }
  .pane[hidden] { display: none; }
  table.kv { width: 100%; border-collapse: collapse; }
  .kv th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 4px; border-bottom: 1px solid var(--line); }
  .kv td { padding: 2px 4px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .kv td.c { width: 22px; } .kv td.x { width: 22px; text-align: center; }
  .kv input[type=text] { width: 100%; border-color: transparent; background: transparent; font: 12px var(--mono); padding: 2px 4px; }
  .kv input[type=text]:hover, .kv input[type=text]:focus { border-color: var(--line); background: var(--input); }
  .kv tr.off input[type=text] { color: var(--muted); text-decoration: line-through; }
  .kv .del { border: 0; background: none; color: var(--muted); visibility: hidden; }
  .kv tr:hover .del { visibility: visible; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .note.warn { color: var(--warn); }
  .radios { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 8px; font-size: 12px; }
  .radios label { display: flex; gap: 4px; align-items: center; }
  .body-pane { display: flex; flex-direction: column; }
  .body-pane[hidden] { display: none; }
  #bodyText { flex: 1; min-height: 90px; width: 100%; resize: none; font: 12px/1.55 var(--mono); padding: 6px 8px; tab-size: 2; }
  #bodyText[hidden] { display: none; }
  .subtabs .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .resp { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .resbody { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .resbody .pane { flex: 1; }
  .status { font-weight: 600; }
  .st-1 { color: var(--muted); } .st-2 { color: var(--ok); } .st-3 { color: var(--m-put); } .st-4 { color: var(--warn); } .st-5 { color: var(--err); }
  pre.code { margin: 0; font: 12px/1.55 var(--vscode-editor-font-family, monospace); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
  .code .k { color: var(--code-key); } .code .s { color: var(--code-str); } .code .n { color: var(--code-num); }
  .code.error { color: var(--err); }
  .code .c { color: var(--muted); font-style: italic; }
  .fmt { font: 600 10.5px var(--mono); letter-spacing: .04em; }
  table.csv { border-collapse: collapse; font: 12px var(--mono); white-space: pre-wrap; }
  table.csv th, table.csv td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; vertical-align: top; }
  table.csv th { position: sticky; top: 0; background: var(--bg); font-weight: 600; }
  .empty { margin: 0; padding: 18px 14px; color: var(--muted); }
  .empty[hidden], .allow[hidden], .bodynote[hidden] { display: none; }
  .bodynote { margin: 8px 14px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--warn); }
  .bodynote span { margin-right: auto; }
  .bodynote .btn[hidden] { display: none; }
  .form { display: grid; grid-template-columns: max-content minmax(0, 240px); gap: 8px 12px; align-items: center; font-size: 12px; }
  .form select, .form input { padding: 3px 6px; }
  .allow { margin: 8px 14px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; }
  .allow b { font: 600 12px var(--mono); margin-right: 8px; }
  .loading { position: absolute; inset: 31px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); z-index: 1; }
  .loading[hidden] { display: none; }
  .loading .bar2 { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; }
  .loading .bar2::after { content: ""; position: absolute; top: 0; width: 30%; height: 100%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
  .spin { position: relative; width: 48px; height: 48px; }
  .spin i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; animation: spin 1.1s cubic-bezier(.5, .1, .5, .9) infinite; }
  .spin i:nth-child(1) { border-top-color: var(--accent); }
  .spin i:nth-child(2) { inset: 7px; border-right-color: var(--m-put); animation-duration: 1.6s; animation-direction: reverse; }
  .spin i:nth-child(3) { inset: 14px; border-bottom-color: var(--ok); animation-duration: .9s; }
  .ld-label b { font-weight: 400; animation: blink 1.2s infinite; } .ld-label b:nth-child(2) { animation-delay: .2s; } .ld-label b:nth-child(3) { animation-delay: .4s; }
  .ld-sub { font: 11px var(--mono); color: var(--muted); max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .spin i, .loading .bar2::after, .ld-label b { animation: none; } }
</style>
</head>
<body>
<div class="urlrow">
  <div class="urlbox">
    <select id="method" aria-label="Method"></select>
    <input id="url" aria-label="URL" spellcheck="false" placeholder="https://api.example.com/path">
  </div>
  <button class="btn pri" id="send" type="button" title="Send (Ctrl+Enter)">Send</button>
</div>
<p class="hint"><kbd>Ctrl+Enter</kbd> Send</p>
<div class="subtabs" role="tablist" aria-label="Request" id="reqTabs">
  <button type="button" data-p="params" class="on">Params<span class="n" id="nParams"></span></button>
  <button type="button" data-p="headers">Headers<span class="n" id="nHeaders"></span></button>
  <button type="button" data-p="body">Body</button>
  <button type="button" data-p="settings">Settings</button>
</div>
<div class="reqpanes">
  <div class="pane" id="p-params">
    <table class="kv"><thead><tr><th></th><th>Key</th><th>Value</th><th></th></tr></thead><tbody id="paramRows"></tbody></table>
    <p class="note">Params stay in sync with the URL query.</p>
  </div>
  <div class="pane" id="p-headers" hidden>
    <table class="kv"><thead><tr><th></th><th>Key</th><th>Value</th><th></th></tr></thead><tbody id="headerRows"></tbody></table>
  </div>
  <div class="pane body-pane" id="p-body" hidden>
    <div class="radios" role="radiogroup" aria-label="Body type" id="bodyTypes">
      <label><input type="radio" name="bt" value="none"> none</label>
      <label><input type="radio" name="bt" value="json"> JSON</label>
      <label><input type="radio" name="bt" value="text"> Text</label>
      <label><input type="radio" name="bt" value="xml"> XML</label>
      <label><input type="radio" name="bt" value="form"> x-www-form-urlencoded</label>
    </div>
    <textarea id="bodyText" spellcheck="false" aria-label="Body"></textarea>
    <table class="kv" id="formTable" hidden><thead><tr><th></th><th>Key</th><th>Value</th><th></th></tr></thead><tbody id="formRows"></tbody></table>
    <p class="note warn" id="bodyWarn" hidden>GET / HEAD cannot send a body. The body is kept; use QUERY to search with a body.</p>
  </div>
  <div class="pane" id="p-settings" hidden>
    <div class="form">
      <label for="redir">Follow redirects</label>
      <select id="redir"><option value="yes">Yes (max 10)</option><option value="no">No</option></select>
      <label for="tls">SSL certificate</label>
      <select id="tls"><option value="verify">Verify</option><option value="ignore">Ignore (dev servers)</option></select>
      <label for="tmo">Timeout (seconds)</label>
      <input id="tmo" type="number" min="1" step="1" placeholder="30">
    </div>
    <p class="note">Saved in the .http file as # @no-redirect, # @insecure and # @timeout.</p>
  </div>
</div>
<div style="background: var(--line)"></div>
<section class="resp" aria-label="Response">
  <div class="subtabs" role="tablist" aria-label="Response" id="resTabs">
    <button type="button" data-r="rbody" class="on" id="resBodyTab">Body</button>
    <button type="button" data-r="rheaders">Headers<span class="n" id="nResHeaders"></span></button>
    <div class="right" id="meta"><span class="fmt" id="fmt"></span><span class="status" id="st"></span><span id="ms"></span><span id="sz"></span></div>
  </div>
  <div class="loading" id="loading" hidden aria-live="polite">
    <div class="bar2"></div>
    <div class="spin"><i></i><i></i><i></i></div>
    <div class="ld-label"><span id="ldText">Sending request</span><span class="dots"><b>.</b><b>.</b><b>.</b></span></div>
    <div class="ld-sub" id="ldSub"></div>
    <button class="btn sm" id="ldCancel" type="button">Cancel</button>
  </div>
  <div class="resbody">
    <p class="allow" id="allow" hidden></p>
    <p class="bodynote" id="bodyNote" hidden><span id="bodyNoteText"></span>
      <button class="btn ghost sm" id="openBody" type="button">Open in editor ↗</button>
      <button class="btn ghost sm" id="saveBody" type="button">Save to file</button></p>
    <p class="empty" id="resEmpty">Send the request to see the response.</p>
    <div class="pane" id="r-rbody"><pre class="code" id="resBody"></pre></div>
    <div class="pane" id="r-rheaders" hidden><table class="kv"><tbody id="resHeaders"></tbody></table></div>
  </div>
</section>
<script nonce="{{nonce}}" src="panel.js"></script>
</body>
</html>
